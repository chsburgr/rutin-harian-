<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hari ini · Rutin</title>
<meta name="description" content="Rutin — pencatat sembilan kebiasaan harian yang sederhana. Grafik yang jujur, tanpa akun, tanpa server.">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#eef0ea">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rutin">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#eef0ea;
  --surface:#ffffff;
  --raised:#f6f7f2;
  --border:#dfe1d7;
  --rule:#eceee5;
  --control:#cfd2c7;
  --text:#191b17;
  --muted:#565b52;
  --faint:#64685f;
  --accent:#2f6a4a;
  --accent-ink:#1f4a33;
  --accent-pale:#e4eee6;
  --accent-mid:#8fb69c;
  --negative:#a33327;
  --grid:#e3e5da;
  --heat0:#eceee5;
  --heat1:#dfebe1;
  --heat2:#b7d2bf;
  --heat3:#84af92;
  --heat4:#2f6a4a;
  --radius-card:10px;
  --radius-control:8px;
  --radius-chip:4px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --shadow-pop:0 10px 30px rgba(25,27,23,.14);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--text);
  font-family:var(--font);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
h1,h2,h3,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink);text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
::selection{background:var(--accent-pale);color:var(--accent-ink)}
.wrap{width:100%;max-width:1140px;margin:0 auto;padding:0 28px}
.skip{position:absolute;left:-9999px;top:8px;z-index:99;background:var(--surface);padding:8px 12px;border-radius:var(--radius-control)}
.skip:focus{left:12px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:var(--ground);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.bar{display:flex;align-items:center;gap:26px;height:62px}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-weight:700;font-size:15px;letter-spacing:-.02em}
.brand:hover{color:var(--text)}
.brand svg{display:block;color:var(--accent)}
.tabs{display:flex;align-items:stretch;gap:2px;height:62px}
.tabs a{
  position:relative;display:inline-flex;align-items:center;padding:0 14px;
  color:var(--muted);text-decoration:none;font-size:14px;font-weight:500;
}
.tabs a:hover{color:var(--text)}
.tabs a[aria-current="page"]{color:var(--text);font-weight:600}
.tabs a[aria-current="page"]::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;background:var(--text)}
.bar-date{margin-left:auto;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- page ---------- */
main{padding:34px 0 44px}
.view{display:block}
.title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:20px}
h1{font-size:30px;line-height:1.15;letter-spacing:-.03em;font-weight:700;margin:0 0 7px}
.sub{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13.5px;line-height:1.45;max-width:82ch}
.streak{display:inline-flex;align-items:center;background:var(--accent-pale);color:var(--accent-ink);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:20px 22px}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:14px}
.card-head h2{font-size:15px;font-weight:600;letter-spacing:-.015em}
.meta{font-size:12px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.grid-2{display:grid;grid-template-columns:1.32fr 1fr;gap:16px;margin-top:16px;align-items:stretch}

/* ---------- today ---------- */
.today{padding:0;overflow:hidden}
.today-head{display:grid;grid-template-columns:172px minmax(0,1fr);gap:26px;align-items:center;padding:22px 24px;border-bottom:1px solid var(--rule)}
.figure{display:flex;align-items:baseline;font-size:42px;line-height:1;font-weight:600;letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.figure .den{font-size:17px;font-weight:500;color:var(--faint);letter-spacing:-.01em;margin-left:3px}
.fig-label{font-size:12px;color:var(--muted);margin-top:7px}
.finding{font-size:15px;line-height:1.45;letter-spacing:-.005em;max-width:66ch}
.finding b{font-weight:600}
.strip{display:flex;gap:14px;margin:13px 0 9px;max-width:460px}
.strip-grp{display:flex;gap:4px;flex:1 1 0;min-width:0}
.seg{height:8px;flex:1 1 0;border-radius:2px;background:var(--rule);transition:background-color .18s ease}
.seg.on{background:var(--accent)}
.hint{font-size:12px;color:var(--faint)}
.groups{display:grid}
.groups.n1{grid-template-columns:1fr}
.groups.n2{grid-template-columns:repeat(2,1fr)}
.groups.n3{grid-template-columns:repeat(3,1fr)}
.group{padding:16px 24px 20px;min-width:0}
.group+.group{border-left:1px solid var(--rule)}
.group-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:12.5px;font-weight:600;letter-spacing:-.005em;margin:0 0 2px}
.group-head span{font-size:11px;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums}
.habit{
  position:relative;display:flex;align-items:flex-start;gap:11px;
  padding:11px 0;border-bottom:1px solid var(--rule);cursor:pointer;
}
.group .habit:last-child{border-bottom:0;padding-bottom:2px}
.habit input{position:absolute;width:1px;height:1px;opacity:0;margin:0}
.box{
  flex:0 0 auto;width:20px;height:20px;margin-top:1px;border:1.5px solid var(--control);
  border-radius:6px;background:var(--surface);transition:background-color .15s,border-color .15s;
}
.box::after{
  content:"";display:block;width:9px;height:5px;margin:5.5px 0 0 5px;
  border-left:2px solid #fff;border-bottom:2px solid #fff;
  transform:rotate(-45deg);opacity:0;transition:opacity .12s;
}
.habit:hover .box{border-color:var(--accent-mid)}
.habit input:checked+.box{background:var(--accent);border-color:var(--accent)}
.habit input:checked+.box::after{opacity:1}
.habit input:focus-visible+.box{outline:2px solid var(--accent);outline-offset:2px}
.habit-body{min-width:0}
.habit-name{display:block;font-size:14px;font-weight:500;line-height:1.4;letter-spacing:-.005em}
.habit-why{display:block;font-size:12px;line-height:1.45;color:var(--muted);margin-top:2px}
.habit input:checked~.habit-body .habit-name{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--control);text-decoration-thickness:1px}
.note-card{display:flex;flex-direction:column}
.note-card .card-head{margin-bottom:12px}
textarea{
  flex:1 1 auto;width:100%;min-height:128px;resize:vertical;
  border:1px solid var(--control);border-radius:var(--radius-control);
  padding:11px 12px;background:var(--surface);font-size:13.5px;line-height:1.6;
}
textarea::placeholder{color:var(--faint)}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.empty-state{padding:24px;font-size:13px;color:var(--muted)}

/* ---------- notices ---------- */
.notice{
  display:block;
  background:var(--accent-pale);border-radius:var(--radius-card);
  padding:11px 16px;margin-bottom:18px;font-size:13px;line-height:1.55;color:var(--accent-ink);
}
.notice a{font-weight:600}

/* ---------- charts ---------- */
.chart{width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.c-grid{stroke:var(--grid);stroke-width:1}
.c-base{stroke:var(--control);stroke-width:1}
.c-axis{fill:var(--faint);font-size:11px;font-family:var(--font)}
.c-axis.dim{fill:var(--control)}
.c-val{fill:var(--muted);font-size:11px;font-family:var(--font);font-variant-numeric:tabular-nums}
.c-val.today{fill:var(--accent-ink);font-weight:600}
.c-bar{fill:var(--accent-mid)}
.c-bar.today{fill:var(--accent)}
.c-target{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 4;opacity:.5}
.c-tlab{fill:var(--accent-ink);font-size:11px;font-family:var(--font);font-weight:600}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);padding:0;margin-bottom:16px}
.stat{padding:15px 22px 17px;border-left:1px solid var(--rule);min-width:0}
.stat:first-child{border-left:0}
.stat-label{display:block;font-size:12px;color:var(--muted)}
.stat-value{display:block;font-size:26px;line-height:1.2;font-weight:600;letter-spacing:-.035em;margin-top:3px;font-variant-numeric:tabular-nums}
.stat-note{display:block;font-size:12px;color:var(--faint);margin-top:1px}

/* ---------- history ---------- */
.grid-chart{display:grid;grid-template-columns:1.85fr 1fr;gap:16px;margin-bottom:16px;align-items:start}
.miss-list{display:flex;flex-direction:column;justify-content:flex-start}
.miss-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:13px}
.miss-row:last-child{border-bottom:0}
.miss-name{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.miss-count{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.miss-empty{color:var(--muted);font-size:12.5px;padding:6px 0 2px;line-height:1.55}
.rule-row{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px}
.rule-row:last-of-type{border-bottom:0}
.rule-row .k{color:var(--muted)}
.rule-row .v{font-weight:500;text-align:right}
.cons-row{display:grid;grid-template-columns:236px minmax(0,1fr) 54px;gap:16px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.cons-row:last-child{border-bottom:0}
.cons-name{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cons-track{height:8px;display:flex;align-items:center}
.cons-bar{height:8px;border-radius:999px;background:var(--accent);width:0;transition:width .35s ease}
.cons-val{text-align:right;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.map-card{display:grid;grid-template-columns:246px minmax(0,1fr);gap:34px;align-items:start}
.map-head{display:flex;flex-direction:column;gap:10px}
.map{display:grid;grid-template-columns:30px repeat(5,30px);grid-auto-rows:30px;gap:5px}
.map-month{font-size:11px;color:var(--faint);display:flex;align-items:flex-end;padding-bottom:2px;font-variant-numeric:tabular-nums}
.map-dow{font-size:11px;color:var(--faint);display:flex;align-items:center;font-variant-numeric:tabular-nums}
.cell{border-radius:4px;background:var(--heat0)}
.cell.h1{background:var(--heat1)}
.cell.h2{background:var(--heat2)}
.cell.h3{background:var(--heat3)}
.cell.h4{background:var(--heat4)}
.cell.pre{background:transparent;border:1px dashed var(--border)}
.cell.future{background:transparent;border:1px dashed var(--rule)}
.cell.today{outline:1.5px solid var(--text);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:11px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.legend i{width:10px;height:10px;border-radius:2px;background:var(--heat0);display:inline-block}
.legend i.h1{background:var(--heat1)}
.legend i.h2{background:var(--heat2)}
.legend i.h3{background:var(--heat3)}
.legend i.h4{background:var(--heat4)}
.wd-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.wd-head h3{font-size:12.5px;font-weight:600}
.wd-head span{font-size:12px;color:var(--faint)}
.wd-row{display:grid;grid-template-columns:34px minmax(0,1fr) 40px;gap:10px;align-items:center;padding:3.5px 0}
.wd-name{font-size:12px;color:var(--muted)}
.wd-track{height:6px;display:flex;align-items:center}
.wd-bar{height:6px;border-radius:999px;background:var(--accent);width:0;transition:width .35s ease}
.wd-val{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}

/* ---------- settings ---------- */
.set-list{margin:0 0 6px}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--rule)}
.set-row:last-child{border-bottom:0}
.set-main{min-width:0}
.set-name{display:block;font-size:14px;font-weight:500;letter-spacing:-.005em}
.set-why{display:block;font-size:12px;color:var(--muted);line-height:1.45;margin-top:2px;max-width:70ch}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:var(--radius-chip);background:var(--raised);border:1px solid var(--border);font-size:11px;color:var(--muted);white-space:nowrap}
.text-btn{background:none;border:0;padding:3px 0;color:var(--muted);font-size:12.5px;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border)}
.text-btn:hover{color:var(--text);text-decoration-color:currentColor}
.text-btn.danger{color:var(--negative)}
.text-btn.danger:hover{color:#7d2219}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 15px;
  border:1px solid var(--control);border-radius:var(--radius-control);background:var(--surface);
  color:var(--text);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;
}
.btn:hover{background:var(--raised)}
.btn-primary{background:var(--text);border-color:var(--text);color:#fff}
.btn-primary:hover{background:#000;color:#fff}
.btn-sm{height:32px;padding:0 12px;font-size:12.5px}
details.add-wrap{border-top:1px solid var(--rule);margin-top:4px;padding-top:14px}
details.add-wrap>summary{
  list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  font-size:13px;font-weight:600;color:var(--accent-ink);padding:4px 0;
}
details.add-wrap>summary::-webkit-details-marker{display:none}
details.add-wrap>summary::before{content:"+";font-size:15px;line-height:1;color:var(--accent);font-weight:500}
details[open].add-wrap>summary::before{content:"–"}
form.edit-form{display:grid;grid-template-columns:1.1fr 1.4fr 130px auto;gap:10px;align-items:end;padding:14px 0 2px}
form.edit-form .field{min-width:0}
.field{display:flex;flex-direction:column;gap:5px}
.field>span{font-size:12px;font-weight:500;color:var(--muted)}
input[type=text],select{
  width:100%;height:36px;border:1px solid var(--control);border-radius:var(--radius-control);
  padding:0 10px;background:var(--surface);font-size:13px;color:var(--text);
}
input[type=text]:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.form-actions{display:flex;gap:8px;align-items:center;padding-bottom:1px}
.form-actions .btn{height:36px}
.edit-panel{background:var(--raised);border-radius:8px;padding:0 14px;margin:6px 0 8px;border:1px solid var(--border)}
.edit-panel form.edit-form{padding:10px 0 12px}
.card-actions{display:flex;flex-wrap:wrap;gap:8px}
.fine{font-size:12px;line-height:1.55;color:var(--faint);margin-top:10px}
.panel-sep{height:1px;background:var(--rule);margin:16px 0}
.danger-zone{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin-top:2px}
.about{font-size:13px;line-height:1.62;color:var(--text);max-width:52ch;margin-bottom:16px}
.author-row{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.author-row .lbl{font-size:12px;color:var(--muted)}
input.author-input{
  width:100%;height:38px;border:0;border-bottom:1px solid var(--control);border-radius:0;
  background:transparent;padding:0 0 6px;font-size:16px;font-weight:600;letter-spacing:-.02em;
}
input.author-input::placeholder{color:var(--control);font-weight:500}
input.author-input:focus{outline:0;border-bottom-color:var(--accent);box-shadow:0 1px 0 var(--accent)}
.set-actions{display:inline-flex;align-items:center;gap:14px}

/* ---------- chrome ---------- */
.foot{border-top:1px solid var(--border);padding:16px 0 26px}
.foot-in{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--faint);font-size:12px}
.toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  background:var(--text);color:#fff;font-size:13px;padding:9px 16px;border-radius:999px;
  box-shadow:var(--shadow-pop);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100vw - 32px);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- responsive ---------- */
@media (max-width:960px){
  .grid-2,.grid-chart{grid-template-columns:1fr}
  .today-head{grid-template-columns:150px minmax(0,1fr);gap:20px}
  .groups.n3{grid-template-columns:1fr}
  .group+.group{border-left:0;border-top:1px solid var(--rule)}
  .group{padding:16px 24px 18px}
  .map-card{grid-template-columns:1fr;gap:22px}
  .map{grid-template-columns:30px repeat(5,1fr);grid-auto-rows:34px}
  form.edit-form{grid-template-columns:1fr 1fr;align-items:end}
  form.edit-form .field:nth-child(3){grid-column:1}
}
@media (max-width:720px){
  .wrap{padding:0 16px}
  main{padding:22px 0 34px}
  .bar{gap:10px;height:56px}
  .tabs{height:56px;margin-left:auto}
  .tabs a{padding:0 9px;font-size:13px}
  .tabs a[aria-current="page"]::after{left:9px;right:9px}
  .bar-date{display:none}
  h1{font-size:26px}
  .brand span{display:inline}
  .today-head{grid-template-columns:1fr;gap:14px;padding:18px 18px 20px}
  .figure{font-size:38px}
  .figure .den{font-size:16px}
  .group{padding:14px 18px 16px}
  .card{padding:17px 18px}
  .stats{grid-template-columns:1fr 1fr}
  .stat{padding:13px 16px 15px;border-left:1px solid var(--rule)}
  .stat:nth-child(odd){border-left:0}
  .stat:nth-child(n+3){border-top:1px solid var(--rule)}
  .stat-value{font-size:23px}
  .cons-row{grid-template-columns:minmax(0,1fr) 46px;gap:4px 12px;padding:9px 0}
  .cons-track{grid-column:1/-1;grid-row:2}
  .cons-val{text-align:right}
  .map-card{gap:18px}
  .map{grid-template-columns:24px repeat(5,38px);grid-auto-rows:38px;justify-content:center}
  .legend{display:grid;grid-template-columns:repeat(3,auto);justify-content:center;gap:7px 18px}
  form.edit-form{grid-template-columns:1fr}
  form.edit-form .field:nth-child(3){grid-column:auto}
  .set-row{grid-template-columns:1fr auto;grid-template-areas:"main main" "chip actions";gap:8px 12px}
  .set-main{grid-area:main}
  .set-row .chip{grid-area:chip;justify-self:start;align-self:center}
  .set-actions{grid-area:actions;justify-self:end;align-self:center}
  .edit-panel{padding:0 12px}
  .foot{flex-direction:column;gap:4px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .toast{bottom:calc(16px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important}
}
</style>
</head>
<body>
<a class="skip" href="#main">Lompat ke isi</a>

<header class="topbar">
  <div class="wrap bar">
    <a class="brand" href="#/hari-ini" aria-label="Rutin — beranda">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" fill="currentColor">
        <circle cx="4" cy="4" r="2.1"/><circle cx="11" cy="4" r="2.1" opacity=".36"/><circle cx="18" cy="4" r="2.1" opacity=".36"/>
        <circle cx="4" cy="11" r="2.1" opacity=".36"/><circle cx="11" cy="11" r="2.1"/><circle cx="18" cy="11" r="2.1" opacity=".36"/>
        <circle cx="4" cy="18" r="2.1" opacity=".36"/><circle cx="11" cy="18" r="2.1" opacity=".36"/><circle cx="18" cy="18" r="2.1"/>
      </svg>
      <span>Rutin</span>
    </a>
    <nav class="tabs" aria-label="Bagian aplikasi">
      <a href="#/hari-ini" data-view="today" aria-current="page">Hari ini</a>
      <a href="#/riwayat" data-view="history">Riwayat</a>
      <a href="#/atur" data-view="settings">Atur</a>
    </nav>
    <span class="bar-date" id="barDate"></span>
  </div>
</header>

<main id="main" class="wrap">
  <section class="view" id="view-today" aria-label="Rutin hari ini"></section>
  <section class="view" id="view-history" aria-label="Riwayat" hidden></section>
  <section class="view" id="view-settings" aria-label="Pengaturan" hidden></section>
</main>

<footer class="foot">
  <div class="wrap foot-in">
    <span>Rutin — sembilan kebiasaan harian</span>
    <span id="footAuthor">Data tersimpan di peramban ini</span>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">Aplikasi ini butuh JavaScript untuk mencatat rutin dan menggambar grafik.</p></noscript>

<script>
(function(){
  "use strict";

  /* ---------------------------------------------------------------- data */
  var KEY = "rutin.v1";
  var CATS = [
    {id:"pagi",  name:"Pagi",  time:"05.00–09.00"},
    {id:"siang", name:"Siang", time:"12.00–16.00"},
    {id:"malam", name:"Malam", time:"20.00–23.00"}
  ];
  var HARI = ["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
  var WD = ["Min","Sen","Sel","Rab","Kam","Jum","Sab"];
  var BULAN = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  var DEFAULT_HABITS = [
    {id:"h1", cat:"pagi",  label:"Bangun pukul 05.30",           why:"Jam bangun yang sama setiap hari lebih menentukan kualitas tidur daripada jumlah jamnya."},
    {id:"h2", cat:"pagi",  label:"Minum 500 ml air",             why:"Setelah 7–8 jam tanpa cairan, segelas air membantu fokus sebelum sarapan."},
    {id:"h3", cat:"pagi",  label:"Gerak 20 menit",               why:"Jalan cepat, sepeda, atau peregangan. Cukup sampai napas naik, tidak perlu sampai pegal."},
    {id:"h4", cat:"siang", label:"Blok fokus 45 menit",          why:"Satu tugas saja, ponsel di laci. Otak butuh sekitar 15 menit untuk masuk ke dalamnya."},
    {id:"h5", cat:"siang", label:"Sayur di makan siang",         why:"Setengah piring sayur dan satu sumber protein menjaga energi tetap rata sampai sore."},
    {id:"h6", cat:"siang", label:"Jalan 10 menit setelah makan", why:"Jalan santai setelah makan membantu tubuh memakai gula darah dengan lebih baik."},
    {id:"h7", cat:"malam", label:"Tulis 3 syukur, 1 pelajaran",  why:"Cukup tiga baris. Menuliskan yang berjalan melatih perhatian untuk melihatnya lagi."},
    {id:"h8", cat:"malam", label:"Ponsel di luar kamar",         why:"Layar di kamar menunda tidur dan memecah tidur di tengah malam."},
    {id:"h9", cat:"malam", label:"Tidur sebelum 22.30",          why:"Tidur 7–8 jam adalah fondasi dari semua rutin lain di daftar ini."}
  ];

  /* ------------------------------------------------------------- helpers */
  function $(s,r){ return (r||document).querySelector(s); }
  function $$(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g,function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  function iso(d){
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function parseISO(s){
    var p = String(s).split("-");
    return new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
  }
  function addDays(d,n){
    var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate()+n);
    return x;
  }
  function todayISO(){ return iso(new Date()); }
  function daysBetween(a,b){
    return Math.round((parseISO(b).getTime() - parseISO(a).getTime())/86400000);
  }
  function longDate(s){
    var d = parseISO(s);
    return HARI[d.getDay()]+", "+d.getDate()+" "+BULAN[d.getMonth()]+" "+d.getFullYear();
  }
  function shortDate(s){
    var d = parseISO(s);
    return d.getDate()+" "+BULAN[d.getMonth()].slice(0,3);
  }
  function roundTop(x,y,w,h,r){
    if (h <= 0) return "";
    r = Math.min(r, w/2, h);
    return "M"+x+","+(y+h)+"V"+(y+r)+"Q"+x+","+y+" "+(x+r)+","+y+
           "H"+(x+w-r)+"Q"+(x+w)+","+y+" "+(x+w)+","+(y+r)+"V"+(y+h)+"Z";
  }

  /* --------------------------------------------------------------- state */
  function defaultState(){
    return {
      v:1,
      author:"",
      created:todayISO(),
      habits:DEFAULT_HABITS.map(function(h){ return Object.assign({},h); }),
      log:{}
    };
  }
  function migrate(raw){
    var base = defaultState();
    if (!raw || typeof raw !== "object") return base;
    var s = {v:1, author:"", created:base.created, habits:[], log:{}};

    if (typeof raw.author === "string") s.author = raw.author.slice(0,60);
    if (/^\d{4}-\d{2}-\d{2}$/.test(raw.created||"")) s.created = raw.created;

    var seen = {};
    if (Array.isArray(raw.habits) && raw.habits.length){
      raw.habits.forEach(function(h,i){
        if (!h || typeof h.id !== "string" || typeof h.label !== "string") return;
        var id = h.id.replace(/[^A-Za-z0-9_-]/g,"").slice(0,40) || ("h"+i);
        while (seen[id]) id = id+"x";
        seen[id] = true;
        s.habits.push({
          id:id,
          label:h.label.slice(0,80),
          why:typeof h.why === "string" ? h.why.slice(0,240) : "",
          cat:["pagi","siang","malam"].indexOf(h.cat) >= 0 ? h.cat : "pagi"
        });
      });
    }
    if (!s.habits.length) s.habits = base.habits.map(function(h){ return Object.assign({},h); });

    if (raw.log && typeof raw.log === "object" && !Array.isArray(raw.log)){
      Object.keys(raw.log).forEach(function(k){
        if (!/^\d{4}-\d{2}-\d{2}$/.test(k)) return;
        var e = raw.log[k];
        if (!e || typeof e !== "object") return;
        var out = {};
        s.habits.forEach(function(h){ if (e[h.id]) out[h.id] = true; });
        if (typeof e.note === "string" && e.note.trim()) out.note = e.note.slice(0,4000);
        if (Object.keys(out).length) s.log[k] = out;
      });
    }
    var keys = Object.keys(s.log).sort();
    if (keys.length && keys[0] < s.created) s.created = keys[0];
    if (s.created > todayISO()) s.created = todayISO();
    return s;
  }
  var S = (function(){
    try {
      var raw = localStorage.getItem(KEY);
      return raw ? migrate(JSON.parse(raw)) : defaultState();
    } catch(e){ return defaultState(); }
  })();
  var storageOK = true;
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }
    catch(e){
      if (storageOK){
        storageOK = false;
        toast("Penyimpanan peramban penuh — unduh cadangan di halaman Atur.");
      }
      return false;
    }
  }

  /* ------------------------------------------------------------ derived */
  function total(){ return S.habits.length; }
  function targetCount(){
    if (!total()) return 0;
    return Math.max(1, Math.round(total()*0.75));
  }
  function targetPct(){
    if (!total()) return 0;
    return Math.round(targetCount()/total()*100);
  }
  function doneOn(d){
    var e = S.log[d];
    if (!e) return 0;
    var n = 0;
    S.habits.forEach(function(h){ if (e[h.id]) n++; });
    return n;
  }
  function pctOn(d){
    return total() ? Math.round(doneOn(d)/total()*100) : 0;
  }
  function isTuntas(d){
    return total() > 0 && doneOn(d) >= targetCount();
  }
  function isChecked(d,id){
    var e = S.log[d];
    return !!(e && e[id]);
  }
  function streak(){
    var d = new Date();
    if (!isTuntas(iso(d))) d = addDays(d,-1);
    var n = 0;
    while (n < 3660 && isTuntas(iso(d))){ n++; d = addDays(d,-1); }
    return n;
  }
  function daysSinceStart(){
    return Math.max(1, daysBetween(S.created, todayISO()) + 1);
  }
  function windowDays(max){
    return Math.max(1, Math.min(max || 30, daysSinceStart()));
  }
  function rangeDays(n){
    var out = [];
    for (var i = n-1; i >= 0; i--){
      var dt = addDays(new Date(), -i);
      var key = iso(dt);
      out.push({
        iso:key, wd:WD[dt.getDay()],
        active:key >= S.created,
        today:key === todayISO(),
        pct:pctOn(key), done:doneOn(key)
      });
    }
    return out;
  }
  function avgOf(days){
    var sum = 0, n = 0;
    days.forEach(function(d){ if (d.active){ sum += d.pct; n++; } });
    return n ? Math.round(sum/n) : 0;
  }
  function activeIn(days){
    return days.filter(function(d){ return d.active; }).length;
  }
  function loggedDays(){
    return Object.keys(S.log).filter(function(k){
      return Object.keys(S.log[k]).some(function(x){ return x !== "note"; });
    }).length;
  }
  function tuntasCount(days){
    var n = 0;
    for (var i = 0; i < days; i++){
      var key = iso(addDays(new Date(), -i));
      if (key < S.created) break;
      if (isTuntas(key)) n++;
    }
    return n;
  }
  function weekdayStats(){
    var buckets = [];
    for (var i = 0; i < 7; i++) buckets.push({sum:0, n:0});
    var w = windowDays(30);
    for (var j = 1; j < w; j++){          /* hari yang sudah lewat, bukan hari ini */
      var dt = addDays(new Date(), -j);
      var key = iso(dt);
      if (key < S.created) break;
      buckets[dt.getDay()].sum += pctOn(key);
      buckets[dt.getDay()].n++;
    }
    return buckets.map(function(b,i){
      return {day:i, avg:b.n ? Math.round(b.sum/b.n) : null, n:b.n};
    });
  }
  function missStats(){
    var w = windowDays(30);
    var rows = S.habits.map(function(h){
      var miss = 0, poss = 0;
      for (var i = 1; i < w; i++){
        var key = iso(addDays(new Date(), -i));
        if (key < S.created) break;
        poss++;
        if (!isChecked(key,h.id)) miss++;
      }
      return {habit:h, miss:miss, poss:poss};
    });
    rows.sort(function(a,b){ return b.miss - a.miss; });
    return rows;
  }
  function consistencyRows(){
    var w = windowDays(30);
    return S.habits.map(function(h){
      var done = 0;
      for (var i = 0; i < w; i++){
        var key = iso(addDays(new Date(), -i));
        if (key < S.created) break;
        if (isChecked(key,h.id)) done++;
      }
      return {habit:h, done:done, poss:w};
    });
  }
  function noteOf(d){
    return (S.log[d] && S.log[d].note) || "";
  }

  /* ---------------------------------------------------------- copy bits */
  function findingHTML(done,t,goal){
    if (!t) return "Belum ada rutin. <a href=\"#/atur\">Tambah satu rutin</a> untuk memulai.";
    var next = null;
    for (var i = 0; i < S.habits.length; i++){
      if (!isChecked(todayISO(), S.habits[i].id)){ next = S.habits[i]; break; }
    }
    if (done === 0){
      return "<b>Mulai dari satu.</b> " + esc(next.label) + " — centang, lalu lihat grafiknya tumbuh.";
    }
    if (done >= t){
      return "<b>Sapu bersih.</b> Semua " + t + " rutin selesai. Tutup hari dengan tidur cukup.";
    }
    if (done >= goal){
      return "<b>Hari tuntas.</b> " + (t-done) + " rutin lagi untuk sapu bersih.";
    }
    return "<b>" + (t-done) + " rutin lagi</b> untuk hari tuntas. Berikutnya: " + esc(next.label) + ".";
  }
  function hintHTML(t,goal){
    if (!t) return "Rutin bisa ditambah dan diubah di halaman Atur.";
    return "Hari dihitung tuntas bila " + goal + " dari " + t + " rutin selesai.";
  }
  function streakLabel(){
    var n = streak();
    return n === 0 ? "" : "Deret " + n + " hari";
  }
  function historyFinding(){
    var past = weekdayStats().filter(function(d){ return d.avg !== null; });
    var logged = loggedDays();
    if (!logged) return "Belum ada riwayat. Centang rutin pertamamu hari ini, grafiknya akan terisi sendiri.";
    if (past.length < 2){
      return logged + " hari tercatat. Rata-rata per hari mulai terlihat setelah beberapa hari.";
    }
    var sorted = past.slice().sort(function(a,b){ return a.avg - b.avg; });
    var low = sorted[0], high = sorted[sorted.length-1];
    return HARI[low.day] + " paling lemah (rata-rata " + low.avg + "%), " +
           HARI[high.day] + " paling kuat (" + high.avg + "%) · " + logged + " hari tercatat.";
  }

  /* ------------------------------------------------------------ builders */
  function checkedAttr(d,id){ return isChecked(d,id) ? " checked" : ""; }

  function stripHTML(d){
    return CATS.map(function(c){
      var hs = S.habits.filter(function(h){ return h.cat === c.id; });
      if (!hs.length) return "";
      return "<div class=\"strip-grp\">" + hs.map(function(h){
        return "<span class=\"seg" + (isChecked(d,h.id) ? " on" : "") + "\" data-seg=\"" + esc(h.id) + "\"></span>";
      }).join("") + "</div>";
    }).join("");
  }

  function groupsHTML(d){
    var cats = CATS.map(function(c){
      return {cat:c, habits:S.habits.filter(function(h){ return h.cat === c.id; })};
    }).filter(function(g){ return g.habits.length; });
    return cats.map(function(g){
      return "<div class=\"group\">" +
        "<h2 class=\"group-head\">" + g.cat.name + " <span>" + g.cat.time + "</span></h2>" +
        g.habits.map(function(h){
          return "<label class=\"habit\">" +
            "<input type=\"checkbox\" data-toggle=\"" + esc(h.id) + "\"" + checkedAttr(d,h.id) + ">" +
            "<span class=\"box\" aria-hidden=\"true\"></span>" +
            "<span class=\"habit-body\">" +
              "<span class=\"habit-name\">" + esc(h.label) + "</span>" +
              (h.why ? "<span class=\"habit-why\">" + esc(h.why) + "</span>" : "") +
            "</span>" +
          "</label>";
        }).join("") +
      "</div>";
    }).join("");
  }

  function catCount(){
    return CATS.filter(function(c){
      return S.habits.some(function(h){ return h.cat === c.id; });
    }).length;
  }

  function viewToday(){
    var d = todayISO();
    var done = doneOn(d), t = total(), goal = targetCount();
    var firstRun = loggedDays() === 0;
    var avg7 = avgOf(rangeDays(7));
    var label = streakLabel();
    var n = catCount();
    return (
      (firstRun ? "<div class=\"notice\" id=\"firstRun\">Baru di sini? Centang satu rutin hari ini — grafik dan riwayat akan terisi sendiri. <a href=\"#/atur\">Atur rutin</a></div>" : "") +
      "<div class=\"title-row\">" +
        "<div>" +
          "<h1>Hari ini</h1>" +
          "<p class=\"sub\"><span>" + longDate(d) + "</span>" +
            (label ? "<span class=\"streak\" id=\"streakChip\">" + label + "</span>" : "<span class=\"streak\" id=\"streakChip\" hidden></span>") +
          "</p>" +
        "</div>" +
      "</div>" +
      "<section class=\"card today\">" +
        "<div class=\"today-head\">" +
          "<div>" +
            "<div class=\"figure\"><span id=\"doneCount\">" + done + "</span><span class=\"den\">/" + t + "</span></div>" +
            "<div class=\"fig-label\">rutin selesai</div>" +
          "</div>" +
          "<div>" +
            "<p class=\"finding\" id=\"finding\" aria-live=\"polite\">" + findingHTML(done,t,goal) + "</p>" +
            "<div class=\"strip\" id=\"dayStrip\" aria-hidden=\"true\">" + stripHTML(d) + "</div>" +
            "<p class=\"hint\" id=\"todayHint\">" + hintHTML(t,goal) + "</p>" +
          "</div>" +
        "</div>" +
        (t
          ? "<div class=\"groups n" + n + "\">" + groupsHTML(d) + "</div>"
          : "<p class=\"empty-state\">Belum ada rutin. <a href=\"#/atur\">Tambah rutin pertama</a> — mulailah dari satu.</p>") +
      "</section>" +
      "<div class=\"grid-2\">" +
        "<section class=\"card note-card\">" +
          "<div class=\"card-head\"><h2>Catatan hari ini</h2><span class=\"meta\" id=\"noteState\"></span></div>" +
          "<textarea id=\"note\" maxlength=\"4000\" placeholder=\"Satu hal yang berjalan, satu hal yang berat.\">" + esc(noteOf(d)) + "</textarea>" +
        "</section>" +
        "<section class=\"card\">" +
          "<div class=\"card-head\"><h2>Tujuh hari terakhir</h2><span class=\"meta\">" + (avg7 ? "rata-rata " + avg7 + "%" : "") + "</span></div>" +
          "<div class=\"chart\" data-chart=\"week\"></div>" +
        "</section>" +
      "</div>"
    );
  }

  function viewHistory(){
    var days7 = rangeDays(7);
    var avg7 = avgOf(days7);
    var w = windowDays(30);
    var wd = weekdayStats();
    var pastDays = wd.filter(function(x){ return x.avg !== null; });
    var cons = consistencyRows();
    var misses = missStats().slice(0,5);
    var st = streak();

    var missRows;
    if (!pastDays.length){
      missRows = "<div class=\"rule-row\"><span class=\"k\">Hari tuntas</span><span class=\"v\">" + targetCount() + " dari " + total() + " rutin</span></div>" +
        "<div class=\"rule-row\"><span class=\"k\">Deret</span><span class=\"v\">hari tuntas berurutan</span></div>" +
        "<div class=\"rule-row\"><span class=\"k\">Hari ini</span><span class=\"v\">tidak dihitung terlewat</span></div>" +
        "<p class=\"miss-empty\">Grafik dan daftar mulai terisi setelah satu hari terlewati.</p>";
    } else if (misses.every(function(m){ return m.miss === 0; })){
      missRows = "<p class=\"miss-empty\">Tidak ada yang terlewat dalam " + w + " hari terakhir.</p>";
    } else {
          missRows = misses.filter(function(m){ return m.miss > 0; }).map(function(m){
        return "<div class=\"miss-row\"><span class=\"miss-name\">" + esc(m.habit.label) + "</span>" +
               "<span class=\"miss-count\">" + m.miss + " hari</span></div>";
      }).join("");
    }

    var consRows = cons.map(function(r){
      var p = r.poss ? Math.round(r.done/r.poss*100) : 0;
      return "<li class=\"cons-row\">" +
        "<span class=\"cons-name\">" + esc(r.habit.label) + "</span>" +
        "<span class=\"cons-track\"><span class=\"cons-bar\" style=\"width:" + p + "%\"></span></span>" +
        "<span class=\"cons-val\">" + r.done + "/" + r.poss + "</span>" +
      "</li>";
    }).join("");

    var wdRows = pastDays.length ? wd.map(function(x){
      return "<div class=\"wd-row\">" +
        "<span class=\"wd-name\">" + WD[x.day] + "</span>" +
        "<span class=\"wd-track\">" + (x.avg === null ? "" : "<span class=\"wd-bar\" style=\"width:" + x.avg + "%\"></span>") + "</span>" +
        "<span class=\"wd-val\">" + (x.avg === null ? "–" : x.avg + "%") + "</span>" +
      "</div>";
    }).join("") : "<p class=\"miss-empty\">Rata-rata muncul setelah ada hari yang lewat.</p>";

    var weakDay = pastDays.length ? pastDays.slice().sort(function(a,b){ return a.avg-b.avg; })[0] : null;
    var weakLine = weakDay
      ? "<p class=\"fine\" style=\"margin-top:12px\">Hari terlemah: " + HARI[weakDay.day] + " (" + weakDay.avg + "%). Coba rutin yang lebih ringan untuk hari itu.</p>"
      : "";

    return "<div class=\"title-row\"><div>" +
        "<h1>Riwayat</h1>" +
        "<p class=\"sub\">" + historyFinding() + "</p>" +
      "</div></div>" +
      "<div class=\"card stats\">" +
        "<div class=\"stat\"><span class=\"stat-label\">Hari tuntas</span><span class=\"stat-value\">" + tuntasCount(w) + "</span><span class=\"stat-note\">dari " + w + " hari</span></div>" +
        "<div class=\"stat\"><span class=\"stat-label\">Deret sekarang</span><span class=\"stat-value\">" + st + "</span><span class=\"stat-note\">hari beruntun</span></div>" +
        "<div class=\"stat\"><span class=\"stat-label\">Rata-rata 7 hari</span><span class=\"stat-value\">" + avg7 + "%</span><span class=\"stat-note\">dari " + activeIn(days7) + " hari</span></div>" +
        "<div class=\"stat\"><span class=\"stat-label\">Hari tercatat</span><span class=\"stat-value\">" + loggedDays() + "</span><span class=\"stat-note\">sejak " + shortDate(S.created) + "</span></div>" +
      "</div>" +
      "<div class=\"grid-chart\">" +
        "<section class=\"card\">" +
          "<div class=\"card-head\"><h2>Tujuh hari terakhir</h2><span class=\"meta\">target " + targetPct() + "%</span></div>" +
          "<div class=\"chart\" data-chart=\"week\"></div>" +
        "</section>" +
        "<section class=\"card\">" +
          "<div class=\"card-head\"><h2>" + (pastDays.length ? "Paling sering terlewat" : "Cara menghitung") + "</h2><span class=\"meta\">" + (pastDays.length ? Math.max(0,w-1) + " hari lewat" : "") + "</span></div>" +
          "<div class=\"miss-list\">" + missRows + "</div>" +
        "</section>" +
      "</div>" +
      "<section class=\"card\" style=\"margin-bottom:16px\">" +
        "<div class=\"card-head\"><h2>Konsistensi per rutin</h2><span class=\"meta\">" + w + " hari terakhir</span></div>" +
        "<ul>" + consRows + "</ul>" +
      "</section>" +
      "<section class=\"card\">" +
        "<div class=\"card-head\"><h2>Peta lima minggu</h2></div>" +
        "<div class=\"map-card\">" +
          "<div class=\"map-head\">" +
            "<div class=\"map\" id=\"map\"></div>" +
            "<div class=\"legend\">" +
              "<span>selesai:</span>" +
              "<span><i></i>0</span>" +
              "<span><i class=\"h1\"></i>1–49%</span>" +
              "<span><i class=\"h2\"></i>50–74%</span>" +
              "<span><i class=\"h3\"></i>75–99%</span>" +
              "<span><i class=\"h4\"></i>100%</span>" +
            "</div>" +
          "</div>" +
          "<div>" +
            "<div class=\"wd-head\"><h3>Rata-rata per hari</h3><span>hari yang sudah lewat</span></div>" +
            wdRows +
            weakLine +
          "</div>" +
        "</div>" +
      "</section>";
  }

  function habitRows(){
    var names = CATS.reduce(function(acc,c){ acc[c.id] = c.name; return acc; }, {});
    return S.habits.map(function(h){
      if (editingId === h.id){
        return "<li class=\"set-row\" style=\"display:block\">" +
          "<div class=\"edit-panel\"><form class=\"edit-form\" data-form=\"" + esc(h.id) + "\">" +
            "<label class=\"field\"><span>Nama rutin</span><input type=\"text\" name=\"label\" required maxlength=\"80\" value=\"" + esc(h.label) + "\"></label>" +
            "<label class=\"field\"><span>Alasan singkat</span><input type=\"text\" name=\"why\" maxlength=\"240\" value=\"" + esc(h.why) + "\"></label>" +
            "<label class=\"field\"><span>Waktu</span><select name=\"cat\">" +
              CATS.map(function(c){ return "<option value=\"" + c.id + "\"" + (h.cat === c.id ? " selected" : "") + ">" + c.name + "</option>"; }).join("") +
            "</select></label>" +
            "<div class=\"form-actions\"><button class=\"btn btn-primary btn-sm\" type=\"submit\">Simpan</button>" +
            "<button class=\"text-btn\" type=\"button\" data-cancel=\"1\">Batal</button></div>" +
          "</form></div></li>";
      }
      return "<li class=\"set-row\">" +
        "<div class=\"set-main\"><span class=\"set-name\">" + esc(h.label) + "</span>" +
          (h.why ? "<span class=\"set-why\">" + esc(h.why) + "</span>" : "") + "</div>" +
        "<span class=\"chip\">" + names[h.cat] + "</span>" +
        "<span class=\"set-actions\"><button class=\"text-btn\" data-edit=\"" + esc(h.id) + "\">Ubah</button>" +
          "<button class=\"text-btn danger\" data-del=\"" + esc(h.id) + "\">Hapus</button></span>" +
      "</li>";
    }).join("");
  }

  function viewSettings(){
    return "<div class=\"title-row\"><div>" +
        "<h1>Atur</h1>" +
        "<p class=\"sub\">Ubah rutinmu, cadangkan data, dan isi nama penulis.</p>" +
      "</div></div>" +
      "<section class=\"card\" style=\"margin-bottom:16px\">" +
        "<div class=\"card-head\"><h2>Rutin kamu</h2><span class=\"meta\">" + total() + " rutin · tuntas bila " + targetCount() + "</span></div>" +
        "<ul class=\"set-list\">" + habitRows() + "</ul>" +
        "<details class=\"add-wrap\"><summary>Tambah rutin</summary>" +
          "<form class=\"edit-form\" id=\"addForm\">" +
            "<label class=\"field\"><span>Nama rutin</span><input type=\"text\" name=\"label\" required maxlength=\"80\" placeholder=\"Misalnya: baca 10 halaman\"></label>" +
            "<label class=\"field\"><span>Alasan singkat</span><input type=\"text\" name=\"why\" maxlength=\"240\" placeholder=\"Kenapa rutin ini penting?\"></label>" +
            "<label class=\"field\"><span>Waktu</span><select name=\"cat\">" +
              CATS.map(function(c){ return "<option value=\"" + c.id + "\">" + c.name + "</option>"; }).join("") +
            "</select></label>" +
            "<div class=\"form-actions\"><button class=\"btn btn-primary btn-sm\" type=\"submit\">Tambah</button></div>" +
          "</form>" +
        "</details>" +
      "</section>" +
      "<div class=\"grid-2\">" +
        "<section class=\"card\">" +
          "<div class=\"card-head\"><h2>Cadangan data</h2></div>" +
          "<p class=\"fine\" style=\"margin-top:0\">Data hanya tersimpan di peramban ini. Kalau kamu pindah perangkat, mengganti alamat situs, atau membersihkan data peramban, riwayat bisa hilang. Unduh cadangan secara berkala.</p>" +
          "<div class=\"card-actions\" style=\"margin-top:14px\">" +
            "<button class=\"btn\" id=\"btnExport\">Unduh cadangan (.json)</button>" +
            "<button class=\"btn\" id=\"btnImport\">Pulihkan dari file</button>" +
            "<input type=\"file\" id=\"fileImport\" accept=\"application/json,.json\" hidden>" +
          "</div>" +
          "<div class=\"panel-sep\"></div>" +
          "<div class=\"danger-zone\">" +
            "<button class=\"text-btn\" id=\"btnClearLog\">Hapus riwayat</button>" +
            "<button class=\"text-btn danger\" id=\"btnReset\">Kembalikan rutin awal</button>" +
          "</div>" +
        "</section>" +
        "<section class=\"card\">" +
          "<div class=\"card-head\"><h2>Tentang &amp; penulis</h2></div>" +
          "<p class=\"about\">Rutin dibuat untuk satu hal: perubahan besar datang dari kebiasaan kecil yang diulang. Sembilan rutin, satu halaman, grafik yang menunjukkan mana yang jalan dan mana yang perlu dipindah.</p>" +
          "<div class=\"author-row\">" +
            "<label class=\"lbl\" for=\"authorName\">Nama penulis</label>" +
            "<input class=\"author-input\" id=\"authorName\" type=\"text\" maxlength=\"60\" placeholder=\"Namamu\" value=\"" + esc(S.author) + "\">" +
          "</div>" +
          "<p class=\"fine\">Nama ini muncul di footer aplikasi. Kosongkan bila tidak ingin ditampilkan.</p>" +
        "</section>" +
      "</div>";
  }

  /* -------------------------------------------------------------- charts */
  function drawWeekChart(host, days, goalPct){
    if (!host) return;
    var w = Math.max(260, Math.floor(host.clientWidth || 600));
    var h = w < 520 ? 200 : 212;
    var pl = 36, pr = 52, pt = 26, pb = 28;
    var pw = Math.max(60, w - pl - pr);
    var ph = h - pt - pb;
    var n = days.length;
    var step = pw / n;
    var bw = Math.min(46, step * 0.44);
    function y(v){ return pt + ph - (v/100)*ph; }

    var svg = "<svg viewBox=\"0 0 " + w + " " + h + "\" width=\"100%\" height=\"" + h + "\" role=\"img\" aria-label=\"" +
      esc("Grafik batang " + days.length + " hari terakhir. " + days.map(function(d){ return d.wd + " " + d.pct + " persen"; }).join(", ")) + "\">";

    [0,50,100].forEach(function(v){
      svg += "<line class=\"" + (v === 0 ? "c-base" : "c-grid") + "\" x1=\"" + pl + "\" y1=\"" + y(v) + "\" x2=\"" + (w-pr) + "\" y2=\"" + y(v) + "\"/>";
      svg += "<text class=\"c-axis\" x=\"" + (pl-8) + "\" y=\"" + (y(v)+3.5) + "\" text-anchor=\"end\">" + v + "</text>";
    });

    var ty = y(goalPct);
    svg += "<line class=\"c-target\" x1=\"" + pl + "\" y1=\"" + ty + "\" x2=\"" + (w-pr) + "\" y2=\"" + ty + "\"/>";
    svg += "<text class=\"c-tlab\" x=\"" + (w-pr+7) + "\" y=\"" + (ty+3.5) + "\">" + goalPct + "%</text>";

    days.forEach(function(d,i){
      var cx = pl + step*i + step/2;
      var label = "<text class=\"c-axis\" x=\"" + cx + "\" y=\"" + (h-8) + "\" text-anchor=\"middle\">" + d.wd + "</text>";
      if (!d.active){
        svg += label;
        return;
      }
      var bh = ph * (d.pct/100);
      var by = pt + ph - bh;
      if (bh > 0.5){
        svg += "<path class=\"c-bar" + (d.today ? " today" : "") + "\" d=\"" +
          roundTop(cx-bw/2, by, bw, bh, 3) + "\"><title>" +
          esc(d.wd + ", " + shortDate(d.iso) + " · " + d.done + " dari " + total() + " rutin (" + d.pct + "%)") +
          "</title></path>";
      }
      svg += "<text class=\"c-val" + (d.today ? " today" : "") + "\" x=\"" + cx + "\" y=\"" + (by-6) + "\" text-anchor=\"middle\">" + d.pct + "%</text>";
      svg += label;
    });

    svg += "</svg>";
    host.innerHTML = svg;
  }

  function drawMap(){
    var host = $("#map");
    if (!host) return;
    var today = new Date();
    var dow = (today.getDay() + 6) % 7;
    var start = addDays(today, -dow - 28);
    var html = "<div></div>";

    for (var week = 0; week < 5; week++){
      var monday = addDays(start, week*7);
      var prev = addDays(start, (week-1)*7);
      html += "<div class=\"map-month\">" + (week === 0 || monday.getMonth() !== prev.getMonth() ? BULAN[monday.getMonth()].slice(0,3) : "") + "</div>";
    }

    for (var r = 0; r < 7; r++){
      html += "<div class=\"map-dow\">" + WD[(r+1)%7] + "</div>";
      for (var c = 0; c < 5; c++){
        var dt = addDays(start, c*7 + r);
        var key = iso(dt);
        var future = key > todayISO();
        var active = !future && key >= S.created;
        var pct = active ? pctOn(key) : 0;
        var cls = "cell";
        if (future) cls += " future";
        else if (!active) cls += " pre";
        else if (pct >= 100) cls += " h4";
        else if (pct >= 75) cls += " h3";
        else if (pct >= 50) cls += " h2";
        else if (pct > 0) cls += " h1";
        if (key === todayISO()) cls += " today";
        var title = future ? "belum terjadi" : (!active ? "sebelum aplikasi dipakai" : (doneOn(key) + " dari " + total() + " rutin (" + pct + "%)"));
        html += "<div class=\"" + cls + "\" title=\"" + esc(WD[dt.getDay()] + ", " + shortDate(key) + " · " + title) + "\"></div>";
      }
    }
    host.innerHTML = html;
  }

  function drawCharts(){
    var host = document.querySelector("#view-" + view + " [data-chart=\"week\"]");
    if (host) drawWeekChart(host, rangeDays(7), targetPct());
    if (view === "history") drawMap();
  }

  /* -------------------------------------------------------------- render */
  var view = "today";
  var editingId = null;

  function renderView(name){
    if (name === "today"){
      $("#view-today").innerHTML = viewToday();
    } else if (name === "history"){
      $("#view-history").innerHTML = viewHistory();
    } else {
      $("#view-settings").innerHTML = viewSettings();
    }
    if (name !== "settings") drawCharts();
  }

  function show(name){
    view = name;
    $$(".view").forEach(function(v){ v.hidden = (v.id !== "view-" + name); });
    $$(".tabs a").forEach(function(a){
      if (a.getAttribute("data-view") === name) a.setAttribute("aria-current","page");
      else a.removeAttribute("aria-current");
    });
    renderView(name);
    document.title = (name === "today" ? "Hari ini" : name === "history" ? "Riwayat" : "Atur") + " · Rutin";
    window.scrollTo(0,0);
  }

  function updateTodayChrome(){
    var d = todayISO();
    var done = doneOn(d), t = total(), goal = targetCount();
    var dc = $("#doneCount");
    if (!dc) return;
    dc.textContent = done;
    var den = $("#view-today .figure .den");
    if (den) den.textContent = "/" + t;
    var f = $("#finding");
    if (f) f.innerHTML = findingHTML(done,t,goal);
    var hint = $("#todayHint");
    if (hint) hint.textContent = hintHTML(t,goal);
    S.habits.forEach(function(h){
      var seg = $("#dayStrip [data-seg=\"" + h.id + "\"]");
      if (seg) seg.classList.toggle("on", isChecked(d,h.id));
    });
    var chip = $("#streakChip");
    if (chip){
      var label = streakLabel();
      chip.textContent = label;
      chip.hidden = !label;
    }
    var first = $("#firstRun");
    if (first && loggedDays() > 0) first.remove();
    var chart = $("#view-today [data-chart=\"week\"]");
    if (chart){
      var meta = chart.parentNode.querySelector(".meta");
      if (meta){
        var a = avgOf(rangeDays(7));
        meta.textContent = a ? "rata-rata " + a + "%" : "";
      }
    }
    drawCharts();
  }

  /* --------------------------------------------------------------- toast */
  var toastTimer;
  function toast(msg){
    var el = $("#toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2600);
  }

  /* ------------------------------------------------------------- actions */
  function toggleHabit(id, on){
    var d = todayISO();
    var e = Object.assign({}, S.log[d] || {});
    if (on) e[id] = true; else delete e[id];
    var hasCheck = Object.keys(e).some(function(k){ return k !== "note"; });
    if (!hasCheck && !e.note) delete S.log[d];
    else S.log[d] = e;
    save();
    updateTodayChrome();
  }

  function exportJSON(){
    var blob = new Blob([JSON.stringify(S,null,2)], {type:"application/json"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "rutin-cadangan-" + todayISO() + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
    toast("Cadangan diunduh.");
  }

  function importFile(file){
    var reader = new FileReader();
    reader.onload = function(){
      var raw;
      try { raw = JSON.parse(String(reader.result)); }
      catch(e){ toast("File bukan JSON yang bisa dibaca."); return; }
      if (!raw || !Array.isArray(raw.habits) || !raw.log || typeof raw.log !== "object"){
        toast("File tidak dikenali sebagai cadangan Rutin.");
        return;
      }
      if (!confirm("Ganti semua rutin dan riwayat di peramban ini dengan isi file?")) return;
      S = migrate(raw);
      editingId = null;
      save();
      show(view);
      updateFooter();
      toast("Data dipulihkan.");
    };
    reader.readAsText(file);
  }

  function updateFooter(){
    var el = $("#footAuthor");
    if (!el) return;
    el.textContent = S.author.trim() ? "Ditulis oleh " + S.author.trim() : "Data tersimpan di peramban ini";
  }

  /* --------------------------------------------------------------- wiring */
  function wire(){
    document.addEventListener("change", function(e){
      var t = e.target;
      if (t && t.matches && t.matches("input[data-toggle]")){
        toggleHabit(t.getAttribute("data-toggle"), t.checked);
      }
      if (t && t.id === "fileImport" && t.files && t.files[0]){
        importFile(t.files[0]);
        t.value = "";
      }
    });

    var noteTimer;
    document.addEventListener("input", function(e){
      var t = e.target;
      if (!t) return;
      if (t.id === "note"){
        clearTimeout(noteTimer);
        noteTimer = setTimeout(function(){
          var d = todayISO();
          var en = Object.assign({}, S.log[d] || {});
          var val = t.value;
          if (val.trim()) en.note = val; else delete en.note;
          if (Object.keys(en).length) S.log[d] = en; else delete S.log[d];
          save();
          var ns = $("#noteState");
          if (ns){
            ns.textContent = "tersimpan";
            setTimeout(function(){ if (ns.textContent === "tersimpan") ns.textContent = ""; }, 1600);
          }
        }, 450);
      }
      if (t.id === "authorName"){
        S.author = t.value.slice(0,60);
        save();
        updateFooter();
      }
    });

    document.addEventListener("click", function(e){
      var t = e.target.closest ? e.target.closest("button, a") : null;
      if (!t) return;

      if (t.id === "btnExport"){ exportJSON(); return; }
      if (t.id === "btnImport"){ $("#fileImport").click(); return; }
      if (t.id === "btnClearLog"){
        if (!confirm("Hapus semua riwayat centang dan catatan? Daftar rutinmu tetap ada.")) return;
        S.log = {};
        S.created = todayISO();
        save();
        show(view);
        toast("Riwayat dihapus.");
        return;
      }
      if (t.id === "btnReset"){
        if (!confirm("Kembalikan ke sembilan rutin awal? Semua rutin buatanmu dan seluruh riwayat akan hilang.")) return;
        var author = S.author;
        S = defaultState();
        S.author = author;
        editingId = null;
        save();
        show(view);
        updateFooter();
        toast("Rutin awal dipulihkan.");
        return;
      }
      var ed = t.getAttribute("data-edit");
      if (ed){ editingId = ed; renderView("settings"); return; }
      if (t.hasAttribute("data-cancel")){ editingId = null; renderView("settings"); return; }
      var del = t.getAttribute("data-del");
      if (del){
        var h = S.habits.filter(function(x){ return x.id === del; })[0];
        if (!h) return;
        if (!confirm("Hapus rutin \"" + h.label + "\"? Riwayat centang untuk rutin ini ikut terhapus.")) return;
        S.habits = S.habits.filter(function(x){ return x.id !== del; });
        Object.keys(S.log).forEach(function(k){
          delete S.log[k][del];
          if (!Object.keys(S.log[k]).length) delete S.log[k];
        });
        save();
        renderView("settings");
        toast("Rutin dihapus.");
      }
    });

    document.addEventListener("submit", function(e){
      var f = e.target;
      if (!f || !f.matches) return;
      if (f.id === "addForm"){
        e.preventDefault();
        var label = f.elements.label.value.trim();
        if (!label) return;
        S.habits.push({
          id:"h" + Date.now().toString(36),
          label:label.slice(0,80),
          why:f.elements.why.value.trim().slice(0,240),
          cat:f.elements.cat.value
        });
        save();
        renderView("settings");
        toast("Rutin ditambahkan.");
        return;
      }
      var id = f.getAttribute("data-form");
      if (id){
        e.preventDefault();
        var h = S.habits.filter(function(x){ return x.id === id; })[0];
        if (!h) return;
        var l = f.elements.label.value.trim();
        if (!l) return;
        h.label = l.slice(0,80);
        h.why = f.elements.why.value.trim().slice(0,240);
        h.cat = f.elements.cat.value;
        editingId = null;
        save();
        renderView("settings");
        toast("Rutin diperbarui.");
      }
    });

    var rt;
    window.addEventListener("resize", function(){
      clearTimeout(rt);
      rt = setTimeout(function(){
        if (view !== "settings") drawCharts();
      }, 180);
    });

    window.addEventListener("hashchange", route);
  }

  var ROUTES = {"#/hari-ini":"today","#/riwayat":"history","#/atur":"settings"};
  function route(){
    show(ROUTES[location.hash] || "today");
  }

  /* ----------------------------------------------------------------- init */
  function boot(){
    $("#barDate").textContent = WD[new Date().getDay()] + ", " + shortDate(todayISO());
    updateFooter();
    wire();
    route();
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
      window.addEventListener("load", function(){
        navigator.serviceWorker.register("./sw.js").catch(function(){});
      });
    }
  }

  boot();
})();
</script>
